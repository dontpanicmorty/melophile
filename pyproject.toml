[project]
name = "melophile"
version = "0.1.0"
description = "Clean up a messy macOS music library: duplicates, tags and formats"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pyside6-essentials>=6.7",                 # the native desktop UI
  "mutagen>=1.47",                           # reads and writes audio tags
  "rapidfuzz>=3.9",                          # fuzzy artist/title matching
  "truststore>=0.9",                         # online lookups trust the macOS keychain's certificates
  "imageio-ffmpeg>=0.5",                     # a self-contained ffmpeg for conversion
  "tomli-w>=1.0",                            # writes settings
  "pyobjc-framework-ScriptingBridge>=10.3",  # talks to the Music app
  "pyobjc-framework-Cocoa>=10.3",            # moves files to the Trash
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
melophile = "melophile.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melophile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
